name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: build, test, format
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # The local shell pins LLVM 21 through devenv. The runner uses its own clang:
      # the core is plain C++20 with no compiler-specific code, and clang-format in
      # this job is the same binary family that formats, so the check is consistent.
      - name: Install the toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build

      # The data merge is mikefarah/yq v4 syntax and is tested against the version the
      # development shell pins, v4.54.1. yq v4.54.2 tightened anchor scoping to the
      # YAML spec, and the merge relies on anchors that span the concatenated files,
      # so 4.54.2 cannot build the data. apt has no yq at all, so the release binary
      # is pinned by version: floating on 'latest' would break the build on an
      # upstream patch, which is exactly what happened on the first CI run.
      - name: Install mikefarah/yq v4.54.1
        run: |
          set -euo pipefail
          yq_version=v4.54.1
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${yq_version}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version
          yq --version | grep -q "${yq_version}"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The .clang-format uses LLVM 20+ spellings - BinPackParameters: BinPack is a
      # string, not a boolean - so a formatter older than 20 cannot read it at all and
      # reports "invalid boolean" for every file. Pin the formatter to LLVM 21.1.8, the
      # version the development shell's clang-tools provides, so the gate checks the
      # same rules the developer formats with. The PyPI wheel carries the binary, so
      # this costs a download of a couple of megabytes.
      - name: Install clang-format 21.1.8
        run: |
          set -euo pipefail
          python3 -m pip install --user clang-format==21.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          clang-format --version
          clang-format --version | grep -q '21.1.8'

      # Formatting is a build step, not a review preference: every commit has to pass
      # it, so review diffs stay about behaviour.
      - name: Format check
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          find Source Tests -name '*.h' -o -name '*.hpp' -o -name '*.cpp' -print | sort \
            | xargs -r clang-format --dry-run -Werror

  # The test suite reads YAML with yq at build time. Before this was checked, a machine
  # without yq configured fine, built fine and ran no tests at all.
  missing-yq-fails-loudly:
    name: a missing yq fails the test build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build

      - name: Configure without yq on PATH
        run: |
          set -euo pipefail
          if command -v yq >/dev/null; then
            sudo rm -f "$(command -v yq)"
          fi
          if cmake -S . -B build-no-yq -G Ninja -DCMAKE_CXX_COMPILER=clang++ \
               -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON; then
            echo "configure succeeded, so a machine without yq still loses the test suite"
            exit 1
          fi

      - name: The failure names yq and the remedy
        run: |
          set -euo pipefail
          # The configure must fail. Under `set -e` a plain failing command in a step
          # ends the step, so the failure has to be asserted inside an `if`, and the
          # log captured for the greps that follow.
          if cmake -S . -B build-no-yq -G Ninja -DCMAKE_CXX_COMPILER=clang++ \
               -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON 2>&1 | tee configure.log; then
            echo "configure succeeded, so a machine without yq still loses the test suite"
            exit 1
          fi
          grep -qi 'yq' configure.log
          grep -qi 'test' configure.log

name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_PARALLEL_LEVEL: 2
      MANIFEST_TIDY_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 2
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      - name: Gate
        shell: bash -euo pipefail {0}
        run: devenv shell -- ./scripts/ci.sh --werror --asan --tidy --log build/ci.log
      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-log
          path: build/ci.log
          if-no-files-found: ignore

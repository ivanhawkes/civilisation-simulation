# The same preset and gate workflow as the engine, without its renderer tests.
post-start = "cmake --preset clang-debug && cmake --build --preset clang-debug"
pre-commit = "./scripts/format-check.sh"
pre-merge = "./scripts/ci.sh --werror --asan"

[step.copy-ignored]
exclude = ["build/", ".devenv/", ".cache/", "CMakeUserPresets.json"]

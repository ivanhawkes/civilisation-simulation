# Worktrunk project configuration.
# Hooks, aliases and defaults for this repository. Docs: https://worktrunk.dev/hook/

# Build the standalone core in every new worktree. The configure step is repeated
# on purpose: devenv's enterShell runs `wt step copy-ignored`, which can copy a
# build directory from another worktree, and a copied CMakeCache.txt holds the
# absolute paths of the worktree it came from.
post-start = "cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug && cmake --build build"

# Only merge on a clean build and a passing test suite.
pre-merge = "cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug && cmake --build build && ctest --test-dir build --output-on-failure"

# Never copy these into a new worktree: they are machine-local, large, and the
# copied CMakeCache.txt points at the absolute paths of the source worktree.
[step.copy-ignored]
exclude = ["build/", ".devenv/", ".cache/"]

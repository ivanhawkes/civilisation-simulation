---
# Field conventions for every item in this file (the full note is in the README,
# under "Units, prices and storage"):
#
#   density            Specific gravity against water at sea level, so 1.0 is
#                      1000 kg/m3. The solid value at 20 C for a metal that is
#                      liquid at that temperature (mercury, gallium, caesium).
#   unitType           The unit that basePrice and unitsPerCubicMetre count.
#   unitsPerCubicMetre Units of loose product filling one cubic metre of solid
#                      material: density x 1000 for Kilogram, 1 for Kilolitre
#                      (1 kL is exactly 1 m3), the tight-nested piece count for
#                      Unit, and 1/thickness for SquareMetre.
#   packFactor         The fraction of an IBC cube's cubic metre that the product
#                      fills, counting packaging, dunnage and interstitial voids.
#                      Mass per IBC cube = density x 1000 x packFactor kilograms.
#   basePrice          Market value per unitType, in credits at one credit to one
#                      US dollar, at 2025 spot and contract prices.
#
# Metals are ingots, so density is the solid metal and unitsPerCubicMetre is the
# mass of solid metal in a cubic metre. packFactor is the stack: prime ingots
# stack well, section and scrap offcuts do not, and reactive metals travel in
# oil-filled drums that spend part of the cube on the drum and the oil.
item-base:

  # Metals
  - item:
      itemId: ItemCopper
      categoryId: CategoryMetals
      ageId: AgeCopper
      displayName: Copper
      description: Copper ingots
      unitsPerCubicMetre: 8960
      basePrice: 10.0
      unitType: Kilogram
      density: 8.96
      packFactor: 0.85


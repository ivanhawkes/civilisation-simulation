---
# Field conventions for every item in this file (the full note is in the README,
# under "Units, prices and storage"):
#
#   density            Specific gravity against water at sea level, so 1.0 is
#                      1000 kg/m3, measured on the material the item is made of.
#   unitType           The unit that basePrice and unitsPerCubicMetre count.
#   unitsPerCubicMetre Units of loose product filling one cubic metre of solid
#                      material: 1 for Kilolitre (1 kL is exactly 1 m3), 1000 for
#                      Litre, density x 1000 for Kilogram, density x 1000000 for
#                      Gram, and the piece, sheet or square metre count that
#                      nests tight into a cubic metre for Unit and Sheet.
#   packFactor         The fraction of an IBC cube's cubic metre that the product
#                      fills, counting packaging, dunnage and interstitial voids.
#                      Mass per IBC cube = density x 1000 x packFactor kilograms.
#                      For the goods counted by piece, that mass is also
#                      unitsPerCubicMetre times the piece's own mass, so jewellery
#                      at 40000 pieces, 12.0 and 0.05 is 15 grams a piece and 600
#                      kilograms a cube on both sides of the identity.
#   basePrice          Market value per unitType, in credits at one credit to one
#                      US dollar, at 2025 wholesale and spot prices.
#
# The discrete goods are where the packing factor earns its keep. A hollow blown
# flask, a copper pot still and a crated canvas are almost all void, so the cube
# holds far less of the material than its dimensions suggest, and fragile ware
# spends more of the cube on straw, foam and crate than on the ware itself.

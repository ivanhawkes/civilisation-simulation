---
# Field conventions for every item in this file (the full note is in the README,
# under "Units, prices and storage"):
#
#   density            Specific gravity against water at sea level, so 1.0 is
#                      1000 kg/m3, measured on the whole seed including its
#                      internal pores, not the heap of seeds.
#   unitType           The unit that basePrice and unitsPerCubicMetre count.
#   unitsPerCubicMetre Units of loose product filling one cubic metre of solid
#                      material: 1 for Kilolitre, since 1 kL is exactly 1 m3.
#   packFactor         The fraction of an IBC cube's cubic metre that the seeds
#                      fill, so it is the test weight of the grain over its
#                      density. Wheat at 78 kg per hectolitre over 1.27 gives
#                      0.61: the rest of the cube is the air between kernels.
#                      Mass per IBC cube = density x 1000 x packFactor kilograms.
#   basePrice          Market value per unitType, in credits at one credit to one
#                      US dollar, at 2025 seed and commodity prices. Certified
#                      seed costs far more than the same grain as food: hybrid
#                      maize seed is a technology product, not a bulk crop.
item-base:

  # Seeds
  - item:
      itemId: ItemWheatSeeds
      categoryId: CategorySeeds
      ageId: AgeCopper
      displayName: Wheat seeds
      description: Wheat seeds
      unitsPerCubicMetre: 1
      basePrice: 350
      unitType: Kilolitre
      density: 1.27
      packFactor: 0.61


---
# Field conventions for every item in this file (the full note is in the README,
# under "Units, prices and storage"):
#
#   density            Specific gravity against water at sea level, so 1.0 is
#                      1000 kg/m3.
#   unitType           The unit that basePrice and unitsPerCubicMetre count.
#   unitsPerCubicMetre Units of loose product filling one cubic metre of solid
#                      material: 1 for Kilolitre (1 kL is exactly 1 m3), 1000 for
#                      Litre, density x 1000 for Kilogram, and 1/thickness for
#                      SquareMetre.
#   packFactor         The fraction of an IBC cube's cubic metre that the product
#                      fills, counting packaging, dunnage and interstitial voids.
#                      Mass per IBC cube = density x 1000 x packFactor kilograms.
#   basePrice          Market value per unitType, in credits at one credit to one
#                      US dollar, at 2025 spot and contract prices.
#
# Most of these are bulk chemicals: a kilolitre is a cubic metre of the material,
# so unitsPerCubicMetre is 1 and the mass in an IBC cube comes from density and
# packFactor. Refrigerated gases travel in vacuum-jacketed tanks, which spend part
# of the cube on the jacket and the vaporiser headspace, and powder chemicals
# travel in drums, whose interstitial air is the largest loss of all.
item-base:

  # Chemicals
  - item: &itemSodiumHydroxide
      <<: *categoryChemicals
      <<: *ironAge
      uniqueId: SodiumHydroxide
      displayName: Sodium Hydroxide
      description: Sodium Hydroxide, AKA caustic soda
      unitsPerCubicMetre: 1
      basePrice: 1700
      unitType: Kilolitre
      density: 2.13
      packFactor: 0.54


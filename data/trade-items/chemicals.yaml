  # 10 micrometre multilayer foil, which is what transfers as a flexible sheet.
  # The price is the 2025 figure for nanoplatelet and CVD film grades, which comes
  # out near 250 credits a kilogram once the film's own mass is counted.
  - item: &itemGraphene

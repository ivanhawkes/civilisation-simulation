---
# The systems of the long-haul trader: the ship that carries cargo between worlds and
# has to survive the pirates who live off that trade. Every system is bought a tier at
# a time out of the resource pool, so the choice in front of the player is the one every
# trader faces: more screen, more gun, more computer, more drive, more mast, more hold.
#
# Field conventions are the ones used by skills.yaml:
#
#   nodeType           Skill for a system the crew train and fit a tier at a time.
#   maxTiers           How many tiers of the system the ship can fit: 3 for every
#                      weapon and screen, so a tier buys thickness, not a new slot.
#   requires           The system that has to be fitted first, and the tier of it
#                      needed. The aft mounts hang off their forward twin: a ship that
#                      has not fitted the forward battery has no power distribution to
#                      put an aft one on. The manoeuvre systems hang off the drive, for
#                      the same reason: the jets tap the drive's feed, and the attitude
#                      thrusters are one more stage of the jets. The fire control and
#                      commercial arrays hang off the long range mast, which is the dish
#                      they all share. The bunkers feed the drive, the countermeasures
#                      answer the mast that spots the lock, and the life support, the
#                      salvage rig and the spares hang off the crew and the hold that
#                      need them.
#   targetEffectID     The effect the engine drives from the tier: the shield bank,
#                      gun battery, laser mount or computer the tier improves.
#   exclusiveGroupId   null for every ship system: a trader who can afford front and
#                      rear screens fits both, so no choice here locks out another.
#   gridX, gridY       Layout for the skill-tree UI. The ship systems sit on their own
#                      row at gridY 1.0: the production skills run along gridY 0.0 and
#                      the age gates along gridY -1.0, the pirate, law, trade and
#                      service trees along gridY -2.0, and the yard, lane and survey
#                      trees along gridY 2.0.
#
# The costs are heavier than the production skills: a shield bank, a gun battery, a
# drive, an array, a hold and a trading AI are not learned at a workbench, and the pool
# the player pays from is the same one that buys the rest of the tree.
skill-base:

  # Shield banks: the screens, by arc of fire.
  - skill:
      uniqueId: ShipShieldsFront
      displayName: Forward Shield Bank
      description: The screen that faces the pirate you are running down
      nodeType: Skill
      requires: []
      maxTiers: 3
      resourceCostPerTier: 2
      targetEffectID: ShieldFront
      exclusiveGroupId: null
      gridX: 0.0
      gridY: 1.0

  - skill:
      uniqueId: ShipShieldsSide
      displayName: Beam Shield Bank
      description: The screen that covers the flanks when a raider circles you
      nodeType: Skill
      requires:
        - nodeId: ShipShieldsFront
          requiredTier: 1
      maxTiers: 3
      resourceCostPerTier: 2
      targetEffectID: ShieldSide
      exclusiveGroupId: null
      gridX: 1.0
      gridY: 1.0

  - skill:

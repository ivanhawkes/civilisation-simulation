---
# Trade services: the permit that lets a ship come down, the premium that covers a
# cargo, and the fence that buys what is not the seller's to sell. The first two are
# the cost of doing business in the open, the third is the market that runs under it.
#
# Field conventions are the ones used by skills.yaml:
#
#   nodeType           Skill throughout: a permit office, an underwriting room and a
#                      fence network all get better by the tier.
#   maxTiers           3 everywhere: a tier is wider terms, cheaper clearance, more
#                      outlets, not a new kind of paperwork.
#   requires           The office that has to exist first, and the tier of it. Cargo
#                      insurance needs the licence that puts a ship on a register and
#                      the tribunal that decides what a cargo was worth, and the fence
#                      needs the harbour that lands the cargo.
#   targetEffectID     The effect the engine drives from the tier: the clearance, the
#                      premium and the outlet.
#   exclusiveGroupId   The fence sits in CleanStanding with the admiralty warrant and
#                      the standing among the crews, because a player who carries a
#                      warrant and a fence is a player the tribunal has already read.
#                      One purchase in that group locks out the rest of it.
#   gridX, gridY       The row at gridY -2.0, beside the law, pirate and service trees.
skill-base:

  - skill:
      uniqueId: TradeDockingLicence
      displayName: Docking Licence
      description: The permit, the berth and the clearance that put a ship on a deck
      nodeType: Skill
      requires: []
      maxTiers: 3
      resourceCostPerTier: 1
      targetEffectID: DockingLicence
      exclusiveGroupId: null
      gridX: 10.0
      gridY: -2.0

  - skill:
      uniqueId: TradeInsurance
      displayName: Cargo Insurance
      description: The premium that pays for a hull, a cargo and a lane gone wrong
      nodeType: Skill
      requires:
        - nodeId: TradeDockingLicence
          requiredTier: 1
        - nodeId: LawTribunal
          requiredTier: 1
      maxTiers: 3
      resourceCostPerTier: 2
      targetEffectID: CargoInsurance
      exclusiveGroupId: null
      gridX: 11.0
      gridY: -2.0

  - skill:
      uniqueId: TradeFencingNetwork
      displayName: Fencing Network
      description: The outlets that take marked cargo, pay for it and ask nothing
      nodeType: Skill
      requires:
        - nodeId: PirateSafeHarbours
          requiredTier: 1
      maxTiers: 3
      resourceCostPerTier: 2
      targetEffectID: FencingNetwork
      exclusiveGroupId: CleanStanding
      gridX: 12.0
      gridY: -2.0

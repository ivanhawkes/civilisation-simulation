---
# One technology gate per age: the skill that gives a civilisation, and the player
# trading with it, access to the technology that age is known for. The Information Age
# gate opens computers, calculators, networking and the goods built on them.
#
# These are the Tech nodes of the tree, against the Skill nodes of skills.yaml and
# spaceship.yaml:
#
#   nodeType     Tech: a gate, not a craft. There is nothing to get better at, you
#                either have the age's technology or you do not.
#   maxTiers     1 for every gate, and the reason the age gate is a Tech node. Two
#                tiers of the Information Age would mean half a microprocessor.
#   requires     The gate of the age before. The ages are a ladder, so the tree can
#                never hand a player starships before they have had writing.
#   resourceCostPerTier Rises with the age: a flint hand axe is one unit of research,
#                a self-improving machine library is three, and the compiled matter of
#                the Sublimation Age is five. The ladder costs 31 units in total,
#                against the 1 a production tier costs.
#   targetEffectID     null: the gate opens a set of goods, it drives no effect of its
#                own. The effects live with the ship systems and the crafts.
#   gridX, gridY       The row at gridY -1.0, in age order from left to right, so the
#                ladder reads left to right as the ages do. The production skills run
#                along gridY 0.0 and the ship systems along gridY 1.0.
#
# The uniqueId of a gate is the uniqueId of its age in base/ages.yaml. The gate and the
# age are the same idea seen from the two ends: a world generated in the Information Age
# has the technology, so a lookup by the world's age finds its gate in the tree, and no
# second naming scheme has to be kept in step.
skill-base:

  - skill:
      uniqueId: StoneAge
      displayName: Stone Age Technology
      description: Fire, dressed stone, bone and antler tools, and the working of hides
      nodeType: Tech
      requires: []
      maxTiers: 1
      resourceCostPerTier: 1
      targetEffectID: null
      exclusiveGroupId: null
      gridX: -10.0
      gridY: -1.0

  - skill:
      uniqueId: CopperAge
      displayName: Copper Age Technology
      description: Smelted copper, the first metal tools and ornaments, and the wheel
      nodeType: Tech

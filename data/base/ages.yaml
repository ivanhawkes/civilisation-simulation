# The ages of the tech tree, in the order they are reached.
#
# The uniqueId of an age is the uniqueId of its gate in skill-tree/ages.yaml, and the
# value the ageId of an item points at, so the same name opens the tree, bounds the
# goods a world can produce and dates the world itself.
ages:

---
# The ages of the tech tree, in the order they are reached.
#
# The ageId of an age is the skillId of its gate in skill-tree/ages.yaml, and the
# value the ageId of an item points at, so the same name opens the tree, bounds the
# goods a world can produce and dates the world itself.
ages:
  - age:
      ageId: AgeStone
      displayName: Stone Age
      description: Stone age
  - age:
      ageId: AgeCopper
      displayName: Copper Age
      description: Copper Age
  - age:
      ageId: AgeBronze

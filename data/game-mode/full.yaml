---
# Every item and skill in the game. The definitions live in the trade-items/,
# skill-tree/ and base/ files; this list only names them, by the itemId of a good
# and the skillId of a node, and build.sh resolves the names into the definitions
# when it merges.
#
# After adding, removing or renaming an item, add its `- itemId:` reference here by
# hand, and its `- skillId:` reference for a node of the tree: a name with no
# definition behind it stops the build with the name printed.

skills:
  - skillId: SkillMining
  - skillId: SkillSmelting
  - skillId: SkillLumber
  - skillId: SkillHerbalism
  - skillId: SkillAgriculture
  - skillId: SkillAnimalHusbandry
  - skillId: SkillAnimalProcessing

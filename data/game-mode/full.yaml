  - skillId: SkillTextiles
  - skillId: SkillPolymers
  - skillId: SkillFuelRefining

  # The age gates: one per age, in age order. Each gate carries the ageId of its
  # age in base/ages.yaml as its skillId, so a world's age finds its gate in the tree.

      <<: *skillYardDrydock
  - skill:
      <<: *skillYardOutfitting
  - skill:
      <<: *skillYardModularHulls
  - skill:
      <<: *skillYardRefitDocks

  # The lanes: convoy, escort, ward and patrol.

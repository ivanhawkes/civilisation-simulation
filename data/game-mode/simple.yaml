  # The skill list of the small game is the whole tree: the items are what makes it
  # small, and a short tree would leave the age gates and the ship systems out of the
  # quick matches they are meant to test.
  #
  # The age gates: one per age, in age order.
  - skill:
      <<: *skillStoneAge
  - skill:
      <<: *skillCopperAge
  - skill:
      <<: *skillBronzeAge
  - skill:
      <<: *skillIronAge
  - skill:
      <<: *skillClassicalAge
  - skill:
      <<: *skillMedievalAge
  - skill:
      <<: *skillPreIndustrialAge
  - skill:
      <<: *skillIndustrialAge
  - skill:
      <<: *skillPostIndustrialAge
  - skill:
      <<: *skillInformationAge
  - skill:
      <<: *skillAIAge
  - skill:
      <<: *skillSpaceAge
  - skill:
      <<: *skillSpaceColonisationAge
  - skill:
      <<: *skillSublimationAge

  # The systems of the long-haul trader: screens, guns, lasers, computers, the drive
  # that makes the running and the mast that sees what is out there.
  - skill:
      <<: *skillShipShieldsFront
  - skill:
      <<: *skillShipShieldsSide
  - skill:
      <<: *skillShipShieldsRear
  - skill:

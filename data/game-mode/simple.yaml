---
# Simple version of the game: the whole skill tree and the small subset of the
# items that makes a quick match. Both are named by uniqueId, and build.sh resolves
# the names into the definitions of the skill-tree/ and trade-items/ files.
skills:
  - skillId: Mining
  - skillId: Smelting
  - skillId: Lumber
  - skillId: Herbalism
  - skillId: Agriculture
  - skillId: AnimalHusbandry
  - skillId: AnimalProcessing
  - skillId: FoodProcessing
  - skillId: KilnMaterials
  - skillId: ChemicalManufacturing
  - skillId: Metalworking
  - skillId: Publishing
  - skillId: Pharmaceuticals
  - skillId: Research
  - skillId: Textiles
  - skillId: Polymers
  - skillId: FuelRefining

  # The skill list of the small game is the whole tree: the items are what makes it
  # small, and a short tree would leave the age gates and the ship systems out of the
  # quick matches they are meant to test.
  #
  # The age gates: one per age, in age order.
  - skillId: StoneAge
  - skillId: CopperAge
  - skillId: BronzeAge
  - skillId: IronAge
  - skillId: ClassicalAge
  - skillId: MedievalAge
  - skillId: Pre-industrialAge
  - skillId: IndustrialAge
  - skillId: Post-industrialAge
  - skillId: InformationAge
  - skillId: AIAge
  - skillId: SpaceAge
  - skillId: SpaceColonisationAge
  - skillId: SublimationAge

  # The systems of the long-haul trader: screens, guns, lasers, computers, the drive
  # that makes the running and the mast that sees what is out there.
  - skillId: ShipShieldsFront
  - skillId: ShipShieldsSide
  - skillId: ShipShieldsRear
  - skillId: ShipGunsFront
  - skillId: ShipGunsRear
  - skillId: ShipLasersFront
  - skillId: ShipLasersRear
  - skillId: ShipNavigationComputer
  - skillId: ShipTraderAI
  - skillId: ShipEngineThrust
  - skillId: ShipManoeuvringJets
  - skillId: ShipAttitudeControl
  - skillId: ShipSensorLongRange
  - skillId: ShipSensorFireControl
  - skillId: ShipSensorCommercial

  # The rest of the ship: the haul, running quiet and the crew.
  - skillId: ShipCargoHolds
  - skillId: ShipFuelBunkers
  - skillId: ShipSalvageRig
  - skillId: ShipLifeSupport
  - skillId: ShipStealthCoating
  - skillId: ShipEmissionsControl
  - skillId: ShipCountermeasures
  - skillId: ShipCrewTraining
  - skillId: ShipDamageControl
  - skillId: ShipSparesLockers

  # The yards: the docks, the lines and the hull production.
  - skillId: YardDrydock
  - skillId: YardOutfitting
  - skillId: YardModularHulls
  - skillId: YardRefitDocks

  # The lanes: convoy, escort, ward and patrol.
  - skillId: LaneConvoy
  - skillId: LaneEscortWing
  - skillId: LaneRouteWard
  - skillId: LaneWardenPatrol

  # Survey and claims: the deep look, the strike and the works.
  - skillId: SurveyDeepRange
  - skillId: ClaimMining
  - skillId: ClaimRefinery
  - skillId: ClaimExclusive

  # Habitats and terraforming: the dome, the loop, the weather and the soil.
  - skillId: HabitatDomes
  - skillId: HabitatClosedLoop
  - skillId: TerraformAtmosphere
  - skillId: TerraformBiosphere

  # The pirate tree: hulls, boarding, ransom and harbours.
  - skillId: PirateRaiderHulls
  - skillId: PirateBoardingParties
  - skillId: PirateRansomExchange
  - skillId: PirateSafeHarbours

  # Law: the warrant, the pardon, the bench and the standing.
  - skillId: LawAdmiraltyWarrant
  - skillId: LawPiratePardon
  - skillId: LawTribunal
  - skillId: LawPirateStanding

  # Trade services: the licence, the premium and the fence.
  - skillId: TradeDockingLicence
  - skillId: TradeInsurance
  - skillId: TradeFencingNetwork

  # The demand side: public medicine and the education system.
  - skillId: ServicePublicMedicine
  - skillId: ServiceEducation

items:


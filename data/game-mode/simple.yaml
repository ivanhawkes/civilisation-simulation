# Simple version of the game
skills:
  - skill:
      <<: *skillMining
  - skill:
      <<: *skillSmelting
  - skill:
      <<: *skillLumber
  - skill:
      <<: *skillHerbalism
  - skill:
      <<: *skillAgriculture
  - skill:
      <<: *skillAnimalHusbandry
  - skill:
      <<: *skillAnimalProcessing
  - skill:
      <<: *skillFoodProcessing
  - skill:
      <<: *skillKilnMaterials
  - skill:
      <<: *skillChemicalManufacturing
  - skill:
      <<: *skillMetalworking
  - skill:

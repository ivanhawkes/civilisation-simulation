  - skill:
      <<: *skillShipAttitudeControl
  - skill:
      <<: *skillShipSensorLongRange
  - skill:
      <<: *skillShipSensorFireControl
  - skill:
      <<: *skillShipSensorCommercial

  # The rest of the ship: the haul, running quiet and the crew.
